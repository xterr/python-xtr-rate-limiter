# The recipe for xtr-rate-limiter: what *Use in an application* in the README
# takes, as data. Keep the two in step — the README is the source.

[bundles]
# "<module>:<class>" = the environments it is listed with, exactly as in BUNDLES.
"xtr_rate_limiter.bundle:RateLimiterBundle" = { all = true }

[files]
# Destination under the application package = template under this recipe.
# The bundle's own defaults written out — no limiter, no I/O — as the place the
# limiters are named, as [notes] asks.
"config/packages/rate_limiter.py" = "files/config/rate_limiter.py.tmpl"

# No [env]: nothing is required. A storage an application gives as env(...)
# must be set when it boots, because booting checks every limiter.

[gitignore]
# Nothing of its own: what is written under var/ belongs to the cache and lock
# bundles, and their recipes ignore it.
lines = []

[notes]
steps = [
  "Name the limiters in config/packages/rate_limiter.py — their type, limit and interval: with no configuration there is no limiter to ask.",
]
check = ["<script> debug:bundles — rate_limiter is listed and active"]
