[project]
name = "xtr-rate-limiter"
version = "3.0.0"
description = "Limits on how often anything may happen — calls, jobs, logins — by fixed window, sliding window or token bucket, kept in memory, in a cache or atomically in Redis."
readme = "README.md"
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rate-limit", "rate-limiter", "throttle", "token-bucket", "sliding-window", "fixed-window", "redis", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.4",
    "xtr-clock>=3.0,<4",
    "xtr-event-dispatcher-contracts>=3.0,<4",
]

[project.optional-dependencies]
cache = [
    "xtr-cache-contracts>=3.0,<4",
]
lock = [
    "xtr-lock>=3.0,<4",
]
redis = [
    "redis>=5.0",
]
di = [
    "xtr-dependency-injection>=3.0,<4",
    "xtr-service-contracts>=3.0,<4",
]

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
rate_limiter = "xtr_rate_limiter.bundle:RateLimiterBundle"

# Advertises the recipe — what *Use in an application* takes — for recipes:sync.
[project.entry-points."xtr_recipes"]
rate_limiter = "xtr_rate_limiter.recipe"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "redis>=5.0",
    "fakeredis[lua]>=2.38.0",
    "xtr-cache>=3.0,<4",
    "xtr-cache-contracts>=3.0,<4",
    "xtr-dependency-injection>=3.0,<4",
    "xtr-lock>=3.0,<4",
    "xtr-service-contracts>=3.0,<4",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# An error carries the RateLimit it is about, and RateLimit raises one. The
# imports are TYPE_CHECKING-only, so no cycle exists at runtime — only in the
# static graph.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_rate_limiter/exception"
reportImportCycles = "none"

# Tests check what a limiter keeps to itself, for the same reason ruff's
# SLF001 is off for tests.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields; the string at a
    # raise site is a `reason` data field. See xtr_rate_limiter/exception/.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# The bundle registers factory functions whose signatures the engine reads at
# runtime; deferring these would register the factories under nothing.
"src/xtr_rate_limiter/bundle/*.py" = ["TC001", "TC002", "TC003"]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
    "FBT003",  # a scripted outcome is a value, not a flag
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol body states a contract; there is nothing there to run.
    "^\\s*\\.\\.\\.$",
]
